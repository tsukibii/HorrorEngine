[plugin]

name="HorrorStudio UI"
description="The studio's HUD for any Godot 4.7 game: the objective and a to-do list, a quest marker that hangs over what a task needs (the nearer the clearer, faint through walls), the reticle and its prompt, lines and answers in a serif voice, cards that are only their words, the inventory's row, a pause menu. Add an HSHud, and an HSQuestMarker on anything to point at."
author="HorrorStudio"
version="0.1"
script="plugin.gd"
