[plugin]

name="HorrorStudio Director"
description="Build a HorrorStudio game in Godot itself: drag-and-drop rooms, doors, things to take, read, use, hide in or sit on, triggers, spots, paths and characters; chapters, tasks with to-do lists, events (when, if, then), dialogue, choices and endings; a dock for the story, the events, the flags and the checks; the studio's runtime (the player, the interactions, the HUD, the menu, saves) underneath; a link to Kimodo for motions."
author="HorrorStudio"
version="0.1"
script="plugin.gd"
