<!doctype html>
<html><head><meta charset="utf-8"><title>Body Editor</title><link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
  :root { --bg: #111214; --panel: #1a1b1e; --line: #2c2d31; --ink: #ddd; --dim: #8b8d93; --gold: #d9a441; --bad: #e05a4f; --ok: #5aa65a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 12px system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  header b { color: var(--gold); letter-spacing: .05em; }
  select, input, button { background: #222327; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--gold); } button.on { border-color: var(--gold); color: var(--gold); }
  main { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  #view { position: relative; min-height: 0; } #view canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #views { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
  #hud { position: absolute; left: 10px; bottom: 10px; color: var(--dim); line-height: 1.6; background: #0009; padding: 6px 9px; border-radius: 4px; max-width: 60%; }
  #hud .warn { color: var(--gold); }
  aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 8px 12px 30px; }
  h3 { margin: 16px 0 6px; color: var(--gold); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
  h3 button { font-size: 10px; padding: 1px 6px; }
  .row { display: grid; grid-template-columns: 110px 1fr 44px; gap: 6px; align-items: center; margin: 3px 0; }
  .row span:first-child { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row small { grid-column: 1 / 4; color: var(--dim); margin-top: -2px; line-height: 1.35; }
  .row input[type=range] { width: 100%; padding: 0; accent-color: var(--gold); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row.moved span:first-child { color: var(--ink); }
  .tog { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; } .tog small { display: block; color: var(--dim); line-height: 1.35; }
  .tog input { accent-color: var(--gold); margin-top: 2px; }
  .bases { display: flex; gap: 6px; margin: 4px 0 6px; } .bases button { flex: 1; }
  #slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slot { border: 1px dashed var(--line); border-radius: 6px; min-height: 150px; position: relative; display: grid; place-items: center; text-align: center; color: var(--dim); cursor: pointer; overflow: hidden; background: #151619; }
  .slot.drop { border-color: var(--gold); color: var(--gold); }
  .slot img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .slot .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px; background: #000b; font-size: 11px; line-height: 1.3; }
  .slot .label.bad { color: var(--bad); } .slot .x { position: absolute; right: 4px; top: 4px; padding: 0 6px; line-height: 16px; background: #000a; }
  details { margin: 2px 0; } summary { cursor: pointer; color: var(--dim); margin: 4px 0; }
  .note { color: var(--dim); line-height: 1.45; margin: 4px 0; }
  #status { color: var(--dim); margin-left: auto; } #status.bad { color: var(--bad); } #status.ok { color: var(--ok); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style></head>
<body>
<header>
  <b>BODY EDITOR</b>
  <select id="who" title="Each character keeps its pictures and settings in Content/Studio/People/&lt;name&gt;/ (git-ignored)"></select>
  <input id="newName" placeholder="new character" style="width:120px"> <button id="make">New</button>
  <button id="save" title="The settings into Content/Studio/People/&lt;name&gt;/character.json">Save</button>
  <button id="expBody" title="The whole body, A-pose, metres, Y up, facing +Z: People/&lt;name&gt;/&lt;name&gt;_body.obj">Export body OBJ</button>
  <button id="expHead" title="The head alone, cut at the neck: the mesh for Mesh to MetaHuman (People/&lt;name&gt;/&lt;name&gt;_head.obj)">Export head OBJ</button>
  <span id="status"></span>
</header>
<main>
  <div id="view">
    <div id="views"><button data-v="body">Body</button><button data-v="head">Head</button><button data-yaw="0">Front</button><button data-yaw="35">¾</button><button data-yaw="90">Side</button></div>
    <div id="hud"></div>
  </div>
  <aside>
    <h3>Base</h3>
    <div class="bases"><button data-base="-1">Feminine</button><button data-base="0">Average</button><button data-base="1">Masculine</button></div>
    <div id="baseRows"></div>

    <h3>Face <span></span></h3>
    <div id="slots"></div>
    <p class="note">Optional. A front picture shapes the face; a side picture (or a three-quarter one: MediaPipe needs to find the face, so up to about 70°) gives its depth. With none, the base and the head sliders make the face.</p>
    <div id="faceRows"></div>
    <label class="tog"><input type="checkbox" id="relative" checked><span>Expressions against this face<small>Full lips read as a pout to MediaPipe; this keeps them from counting as an expression.</small></span></label>

    <h3>Shape <button id="resetShape" title="Every shape slider back to the base">Reset</button></h3>
    <div id="shapeRows"></div>

    <h3>View</h3>
    <label class="tog"><input type="checkbox" id="wire"><span>Wireframe</span></label>
    <label class="tog"><input type="checkbox" id="raking"><span>Raking light<small>A low light from the side: the profile and bumps read better.</small></span></label>
  </aside>
</main>
<script type="module">
// MHR's whole body (Meta's Momentum Human Rig, Apache-2.0) from a base and its 45 identity shapes, computed here from
// Content/Studio/Bodies/MHR_lod1.bin (tools/body/pack_mhr.py); the face from up to two pictures is fitted in Python
// (tools/face_mesh.py's body op, through serve.py) and laid on top. docs/METAHUMAN_LOOKS.md §1.3.
import * as THREE from "three";
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const api = async (u, body) => {
  const r = await fetch(u, body === undefined ? {} : { method: "POST", body: typeof body === "string" || body instanceof Blob ? body : JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
};
const status = (t, cls = "") => { const s = $("#status"); s.textContent = t; s.className = cls; };

// ---- MHR: the packed mesh and its shapes ------------------------------------------------------------------------
const buf = await (await fetch("bodies/MHR_lod1.bin")).arrayBuffer();
const hl = new DataView(buf).getUint32(0, true);
const H = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hl)));
const N = H.points, BASEP = new Float32Array(buf, H.points_at, N * 3), TRIS = new Uint32Array(buf, H.triangles_at, H.triangles * 3);
const SHAPES = (() => {                                 // float16 -> float32, once
  const h = new Uint16Array(buf, H.shapes_at, H.shapes * N * 3), out = new Float32Array(h.length);
  for (let i = 0; i < h.length; i++) {
    const x = h[i], s = x & 0x8000 ? -1 : 1, e = (x >> 10) & 31, f = x & 1023;
    out[i] = s * (e === 0 ? f * 5.960464477539063e-8 : e === 31 ? (f ? NaN : Infinity) : Math.pow(2, e - 15) * (1 + f / 1024));
  }
  return out;
})();
const INFO = await api("api/face/mhr", {}).catch(e => { status(e.message, "bad"); return null; }) ||
  { groups: H.groups, labels: new Array(H.shapes).fill(""), presets: {} };
const PRESETS = INFO.presets;

// ---- the state ------------------------------------------------------------------------------------------------------
const FACE = [   // face_mesh.py's settings (its DEFAULTS), plus how much of the fit shows
  ["strength", "Face strength", 0, 1, 0.05, 1, "How much of the fitted face shows over the base."],
  ["depth", "Depth", 0, 1, 0.05, 0.4, "How much of MediaPipe's depth the face takes from a front picture (a side picture replaces it where it sees)."],
  ["side_depth", "Side depth", 0, 1, 0.05, 1, "How much of the depth the side picture gives."],
  ["follow", "Head follows", 0, 1, 0.05, 0.5, "How much the head (skull, ears) takes the face's proportions; the neck and below never move."],
  ["detail", "Detail", 0, 1.5, 0.05, 1, "The fine pass: eyelids, lips, nostrils."],
  ["smooth", "Smooth", 0.001, 0.1, 0.001, 0.01, "Damps the fit: softer, fewer bumps."],
  ["symmetry", "Symmetry", 0, 1, 0.05, 0.5, "Blends the face toward its mirror image."],
];
const st = { base: 0, height: 1.7, shape: new Array(H.shapes).fill(0), face: Object.fromEntries(FACE.map(f => [f[0], f[5]])) };
let WHO = null, DELTA = null, PICS = [], REPORT = null;

const fmt = (v, step) => (+v).toFixed(step < 0.01 ? 3 : step < 1 ? 2 : 0);
function slider(box, key, label, lo, hi, step, val, help, onInput, title) {
  const inp = el("input", { type: "range", min: lo, max: hi, step, value: val });
  const out = el("output", { textContent: fmt(val, step) });
  const row = el("div", { className: "row", title: title || "" }, el("span", { textContent: label }), inp, out);
  if (help) row.append(el("small", { textContent: help }));
  inp.oninput = () => { out.textContent = fmt(inp.value, step); onInput(+inp.value, row); };
  box.append(row);
  return v => { inp.value = v; out.textContent = fmt(v, step); };
}
const set = {};
set.base = slider($("#baseRows"), "base", "Feminine ↔ masc.", -1, 1, 0.05, 0, "−1 feminine, 0 MHR's average, +1 masculine: the shape sliders add to it.", v => { st.base = v; changed("body"); });
set.height = slider($("#baseRows"), "height", "Height (m)", 1.4, 2.1, 0.01, 1.7, "The whole body scaled to this height.", v => { st.height = v; changed("scale"); });
for (const [k, label, lo, hi, step, def, help] of FACE)
  set[k] = slider($("#faceRows"), k, label, lo, hi, step, def, help, v => { st.face[k] = v; changed(k === "strength" ? "strength" : "face"); });
$("#relative").onchange = () => changed("face");
const shapeSet = [];
for (const [g, [a, b]] of Object.entries(INFO.groups)) {
  const d = el("details", { open: g === "body" }, el("summary", { textContent: `${g[0].toUpperCase() + g.slice(1)} (${b - a})` }));
  for (let i = a; i < b; i++)
    shapeSet[i] = slider(d, i, `${i}: ${INFO.labels[i] || ""}`, -3, 3, 0.05, 0, "", (v, row) => { st.shape[i] = v; row.classList.toggle("moved", v !== 0); changed("body"); }, INFO.labels[i]);
  $("#shapeRows").append(d);
}
for (const b of document.querySelectorAll(".bases button")) b.onclick = () => { st.base = +b.dataset.base; set.base(st.base); changed("body"); };
$("#resetShape").onclick = () => { st.shape.fill(0); shapeSet.forEach(f => f(0)); document.querySelectorAll(".row.moved").forEach(r => r.classList.remove("moved")); changed("body"); };

function weights() {                                   // the base blended in, the sliders on top
  const t = st.base, p = t < 0 ? PRESETS.feminine : PRESETS.masculine, k = Math.abs(t);
  return st.shape.map((v, i) => v + (p ? k * (p[i] || 0) : 0));
}

// ---- the body ---------------------------------------------------------------------------------------------------
const view = $("#view");
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(devicePixelRatio);
view.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x202125);
const camera = new THREE.PerspectiveCamera(26, 1, 0.02, 100);
const hemi = new THREE.HemisphereLight(0xffffff, 0x3a3530, 1.1), key = new THREE.DirectionalLight(0xffffff, 1.6);
scene.add(hemi, camera); camera.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.9, 48), new THREE.MeshStandardMaterial({ color: 0x2a2b30, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const material = new THREE.MeshStandardMaterial({ color: 0xc9b3a2, roughness: 0.62 });
const geo = new THREE.BufferGeometry();
const POS = new Float32Array(N * 3), RAW = new Float32Array(N * 3);
geo.setAttribute("position", new THREE.BufferAttribute(POS, 3)); geo.setIndex(new THREE.BufferAttribute(TRIS, 1));
const mesh = new THREE.Mesh(geo, material); scene.add(mesh);
let SCALE = 1, TOP = 1.7;
function computeBody() {                               // RAW: MHR with the weights, unscaled (what the face fit sees)
  RAW.set(BASEP);
  const w = weights();
  for (let k = 0; k < w.length; k++) {
    const a = w[k]; if (!a) continue;
    const S = SHAPES.subarray(k * N * 3, (k + 1) * N * 3);
    for (let i = 0; i < RAW.length; i++) RAW[i] += a * S[i];
  }
}
function compose() {                                   // POS: RAW + the face, scaled to the height, feet on the floor
  let lo = Infinity, hi = -Infinity;
  for (let i = 1; i < RAW.length; i += 3) { lo = Math.min(lo, RAW[i]); hi = Math.max(hi, RAW[i]); }
  SCALE = st.height / (hi - lo); TOP = st.height;
  for (let i = 0; i < RAW.length; i += 3) { POS[i] = RAW[i] * SCALE; POS[i + 1] = (RAW[i + 1] - lo) * SCALE; POS[i + 2] = RAW[i + 2] * SCALE; }
  if (DELTA) {
    const k = st.face.strength * SCALE;
    for (let j = 0; j < DELTA.idx.length; j++) { const i = DELTA.idx[j] * 3; POS[i] += k * DELTA.d[j * 3]; POS[i + 1] += k * DELTA.d[j * 3 + 1]; POS[i + 2] += k * DELTA.d[j * 3 + 2]; }
  }
  geo.attributes.position.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere();
}
const orbit = { yaw: 0.3, pitch: 0.08, focus: "body" };
function place() {
  const head = orbit.focus === "head", ty = head ? TOP - 0.12 * TOP / 1.7 : TOP * 0.52, d = head ? 0.9 : 4.6;
  camera.position.set(d * Math.sin(orbit.yaw) * Math.cos(orbit.pitch), ty + d * Math.sin(orbit.pitch), d * Math.cos(orbit.yaw) * Math.cos(orbit.pitch));
  camera.lookAt(0, ty, 0);
  key.position.set(...($("#raking").checked ? [3, 0.2, 0.5] : [1, 1.4, 2])); hemi.intensity = $("#raking").checked ? 0.25 : 1.1;
}
function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
addEventListener("resize", resize);
let drag = null;
renderer.domElement.onpointerdown = e => { drag = [e.clientX, e.clientY]; renderer.domElement.setPointerCapture(e.pointerId); };
renderer.domElement.onpointermove = e => { if (!drag) return; orbit.yaw -= (e.clientX - drag[0]) * 0.008; orbit.pitch = Math.max(-1.2, Math.min(1.2, orbit.pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; };
renderer.domElement.onpointerup = () => { drag = null; };
for (const b of document.querySelectorAll("#views button")) b.onclick = () => {
  if (b.dataset.v) orbit.focus = b.dataset.v; else { orbit.yaw = +b.dataset.yaw * Math.PI / 180; orbit.pitch = 0.05; }
  document.querySelectorAll("#views button[data-v]").forEach(x => x.classList.toggle("on", x.dataset.v === orbit.focus));
};
$("#wire").onchange = () => { material.wireframe = $("#wire").checked; };
renderer.setAnimationLoop(() => { place(); renderer.render(scene, camera); });
resize();

// ---- changes: the body here at once, the face from the worker after a pause ----------------------------------------
let faceTimer = null, seq = 0;
function changed(what) {
  if (what === "body") computeBody();
  compose();
  if (what === "body" || what === "face") { clearTimeout(faceTimer); faceTimer = setTimeout(fitFace, what === "body" ? 350 : 150); }
}
async function fitFace() {
  if (!WHO || !PICS.length) { if (DELTA) { DELTA = null; compose(); } hud(); return; }
  const mine = ++seq; status("fitting the face…");
  const side = PICS.filter(p => p.name.startsWith("side.")).map(p => p.name);
  try {
    const r = await api("api/face/body", { name: WHO, weights: weights(), settings: { ...st.face, relative: $("#relative").checked }, side });
    if (mine !== seq) return;
    DELTA = r.idx.length ? { idx: r.idx, d: r.delta } : null; REPORT = r.report; compose(); hud(); status("");
  } catch (e) { if (mine === seq) { status(e.message, "bad"); } }
}
function hud() {
  const lines = [`${H.lod} · ${N} points · ${st.height.toFixed(2)} m`];
  if (REPORT) lines.push(`face from ${REPORT.used} front picture${REPORT.used === 1 ? "" : "s"}${REPORT.sides ? " and a side one" : ""}`);
  $("#hud").replaceChildren(...lines.map(t => el("div", { textContent: t })), ...(REPORT?.warnings || []).map(w => el("div", { className: "warn", textContent: w })));
}

// ---- the pictures ---------------------------------------------------------------------------------------------------
const SLOT_TEXT = { front: "Front picture\nclick or drop", side: "Side picture\n(optional)" };
function drawSlots(missed = []) {
  $("#slots").replaceChildren(...["front", "side"].map(slot => {
    const p = PICS.find(x => x.name.startsWith(slot + ".")), file = el("input", { type: "file", accept: "image/*", hidden: true });
    const box = el("div", { className: "slot", title: slot === "side" ? "a side or three-quarter view: its depth" : "a frontal, neutral, evenly lit face" }, file);
    const each = Object.fromEntries((REPORT?.each || []).map(x => [x.name, x]));
    if (p) {
      const x = each[p.name] || {};
      box.append(el("img", { src: "data:image/jpeg;base64," + p.thumb }),
        el("div", { className: "label" + (x.dropped ? " bad" : ""), textContent: `${slot}${x.turn !== undefined ? ` · ${x.turn}°` : ""}${x.dropped ? ` · not used (${x.dropped})` : ""}` }));
    } else if (missed.some(m => m.startsWith(slot + "."))) {
      box.append(el("div", { textContent: `${slot}: no face found in it`, style: "color: var(--bad)" }));
    } else box.append(el("div", { textContent: SLOT_TEXT[slot], style: "white-space: pre-line" }));
    if (p || missed.some(m => m.startsWith(slot + "."))) {
      const x = el("button", { className: "x", textContent: "×", title: `clear the ${slot} picture` });
      x.onclick = async e => { e.stopPropagation(); await api(`api/picture/${encodeURIComponent(WHO)}/${slot}/png`, ""); detect(); };
      box.append(x);
    }
    box.onclick = () => WHO ? file.click() : status("make or pick a character first", "bad");
    file.onchange = () => file.files[0] && upload(slot, file.files[0]);
    box.ondragover = e => { e.preventDefault(); box.classList.add("drop"); };
    box.ondragleave = () => box.classList.remove("drop");
    box.ondrop = e => { e.preventDefault(); box.classList.remove("drop"); if (e.dataTransfer.files[0]) upload(slot, e.dataTransfer.files[0]); };
    return box;
  }));
}
async function upload(slot, f) {
  if (!WHO) return status("make or pick a character first", "bad");
  const ext = (f.name.split(".").pop() || "png").toLowerCase();
  try { await api(`api/picture/${encodeURIComponent(WHO)}/${slot}/${ext}`, f); } catch (e) { return status(e.message, "bad"); }
  detect();
}
async function detect() {
  if (!WHO) return;
  status("finding the face…");
  try {
    const r = await api("api/face/detect", { name: WHO });
    PICS = r.pictures; REPORT = null; drawSlots(r.missed); status(r.missed.length ? `no face found in ${r.missed.join(", ")}` : "", r.missed.length ? "bad" : "");
    await fitFace(); drawSlots(r.missed);
  } catch (e) { status(e.message, "bad"); }
}

// ---- characters -----------------------------------------------------------------------------------------------------
async function people(pick) {
  const list = (await api("api/people")).people;
  $("#who").replaceChildren(...list.map(p => el("option", { value: p.name, textContent: p.name })));
  if (!list.length) $("#who").append(el("option", { value: "", textContent: "no characters yet: name one, New" }));
  if (pick) $("#who").value = pick;
  return list;
}
async function open(name) {
  WHO = name || null; PICS = []; DELTA = null; REPORT = null; drawSlots();
  const c = WHO ? await api(`api/people/${encodeURIComponent(WHO)}`) : {};
  st.base = c.base ?? 0; st.height = c.height ?? 1.7;
  st.shape = (c.shape || []).concat(new Array(H.shapes).fill(0)).slice(0, H.shapes).map(Number);
  Object.assign(st.face, Object.fromEntries(FACE.map(f => [f[0], f[5]])), c.face || {});
  $("#relative").checked = c.relative !== false;
  set.base(st.base); set.height(st.height); for (const f of FACE) set[f[0]](st.face[f[0]]);
  st.shape.forEach((v, i) => { shapeSet[i](v); });
  document.querySelectorAll("#shapeRows .row").forEach((r, i) => r.classList.toggle("moved", st.shape[i] !== 0));
  computeBody(); compose(); hud();
  if (WHO) detect();
}
const character = () => ({ base: st.base, height: st.height, shape: st.shape, face: st.face, relative: $("#relative").checked,
                           weights: weights(), about: "the body editor (tools/body/): MHR identity weights = the base blended in + shape" });
$("#who").onchange = () => open($("#who").value);
$("#make").onclick = async () => {
  const n = $("#newName").value.trim();
  if (!/^[A-Za-z0-9_-][A-Za-z0-9_.-]*$/.test(n)) return status("a name is letters, digits, _ - .", "bad");
  await api(`api/people/${encodeURIComponent(n)}`, character()); $("#newName").value = "";
  await people(n); WHO = n; drawSlots(); status(`${n}: drop a front picture, or just shape the body`, "ok");
};
$("#save").onclick = async () => {
  if (!WHO) return status("make a character first", "bad");
  const r = await api(`api/people/${encodeURIComponent(WHO)}`, character()); status(`saved ${r.path}`, "ok");
};
function objText(head) {                               // metres, Y up, facing +Z; the head cut 0.245 m under its top (as MHR_head.obj)
  const cut = TOP - 0.245 * SCALE, keep = new Int32Array(N).fill(-1), v = [], f = [];
  const tris = [];
  for (let t = 0; t < TRIS.length; t += 3) {
    const a = TRIS[t], b = TRIS[t + 1], c = TRIS[t + 2];
    if (head && Math.min(POS[a * 3 + 1], POS[b * 3 + 1], POS[c * 3 + 1]) < cut) continue;
    tris.push(a, b, c);
  }
  let n = 0;
  for (const i of tris) if (keep[i] < 0) { keep[i] = ++n; v.push(`v ${POS[i * 3].toFixed(5)} ${POS[i * 3 + 1].toFixed(5)} ${POS[i * 3 + 2].toFixed(5)}`); }
  for (let t = 0; t < tris.length; t += 3) f.push(`f ${keep[tris[t]]} ${keep[tris[t + 1]]} ${keep[tris[t + 2]]}`);
  return [`# ${WHO}: MHR (Meta, Apache-2.0) from the body editor (tools/body/); metres, Y up, facing +Z`, `o ${WHO}_${head ? "head" : "body"}`, ...v, ...f].join("\n") + "\n";
}
for (const [btn, head] of [["#expBody", false], ["#expHead", true]]) $(btn).onclick = async () => {
  if (!WHO) return status("make a character first", "bad");
  await api(`api/people/${encodeURIComponent(WHO)}`, character());
  const r = await api(`api/export/${encodeURIComponent(WHO)}/${encodeURIComponent(`${WHO}_${head ? "head" : "body"}.obj`)}`, objText(head));
  status(`wrote ${r.path}`, "ok");
};
$("#raking").onchange = place;

window.__body = { st, get who() { return WHO; }, get report() { return REPORT; }, get delta() { return DELTA; }, get pics() { return PICS; }, POS, N };   // bodytest.js
const list = await people();
document.querySelector('#views button[data-v="body"]').classList.add("on");
await open(list.length ? list[0].name : null);
</script>
