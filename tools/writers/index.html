<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Writers' Room</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<header>
  <div class="brand">THE WRITERS' ROOM</div>
  <input id="title" placeholder="Untitled" title="the game's working title" spellcheck="false">
  <span id="saved" class="muted"></span>
  <nav id="tabs">
    <button data-tab="brief">Brief</button>
    <button data-tab="river">River</button>
    <button data-tab="bible">Bible</button>
    <button data-tab="faces">Faces</button>
  </nav>
  <div class="spacer"></div>
  <button id="undo" class="ghost" title="undo (Ctrl+Z)">↶</button>
  <button id="redo" class="ghost" title="redo (Ctrl+Shift+Z)">↷</button>
  <div class="switch" id="model" title="who writes with you">
    <button data-b="claude">Claude</button><button data-b="local">Local</button>
  </div>
  <button id="gear" class="ghost" title="the model's settings">⚙</button>
  <button id="sessionsBtn">Sessions</button>
  <button id="buildBtn" class="go" title="build a rough, working outline of the game in the director">Build</button>
</header>
<main>
  <section id="view">
    <div id="brief" class="tab"></div>
    <div id="river" class="tab">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="riverEmpty" class="empty hidden"><b>No river yet</b><span>Fill in the brief, then Draft the story.</span></div>
      <div id="tip"></div>
      <div id="problems" class="hidden"></div>
      <div class="bar" id="riverBar"></div>
    </div>
    <div id="bible" class="tab"></div>
    <div id="faces" class="tab"></div>
  </section>
  <aside id="inspector" class="hidden"></aside>
  <aside id="chat">
    <div class="ch"><b>Assistant</b><button id="chatFold" class="ghost" title="fold">⇥</button></div>
    <div id="sees"></div>
    <div id="msgs"></div>
    <div id="work" class="hidden"></div>
    <textarea id="say" placeholder="Ask, or ask for a change: “make the second ending colder”, “add an easter egg in the kitchen”…"></textarea>
    <div class="send"><span>Enter sends · Shift+Enter a new line</span><button id="stop" class="danger hidden">Stop</button><button id="send" class="go">Send</button></div>
  </aside>
</main>
<div id="modal"></div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
