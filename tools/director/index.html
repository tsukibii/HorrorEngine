<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director's Desk</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#121214;--panel:#1b1b1f;--panel2:#232329;--line:#33333b;--text:#e6e3dc;--dim:#9a978f;--accent:#d9a441;
--scene:#8a63d2;--stitch:#2f9e8f;--choice:#c98a2b;--ending:#c0473f;--good:#5aa65a;--warn:#e0a030;--bad:#e05a4f;--cue:#6fb3d9}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 7px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#5b4318;border-color:var(--accent)}button.on{border-color:var(--accent);color:var(--accent)}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:70px}
input[type=number]{width:62px}input.w{width:100%}input[type=checkbox]{width:auto}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:14px;margin:0 8px 0 0;color:var(--accent);letter-spacing:.04em}
#status{color:var(--dim);margin-left:auto}#status.dirty{color:var(--warn)}
nav{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 12px;color:var(--dim)}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
main{display:flex;height:calc(100% - 78px)}
.view{display:none;flex:1;min-width:0}.view.on{display:flex}
#leftcol{flex:1;display:flex;flex-direction:column;min-width:0}
#board{flex:1;overflow:auto;position:relative;background:radial-gradient(#1f1f24 1px,transparent 1px) 0 0/18px 18px;min-height:120px}
#stagePanel{height:44%;min-height:220px;border-top:1px solid var(--line);display:flex;flex-direction:column;background:#000}
#stageBox{flex:1;position:relative;overflow:hidden}
#stageBar{display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#scrub{flex:1;min-width:120px}
.ov{position:absolute;inset:0;pointer-events:none}
.ov .who{position:absolute;top:8px;left:10px;color:#9a9;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 4px #000}
.ov .ja{position:absolute;bottom:58px;width:100%;text-align:center;color:#999;font-size:13px;text-shadow:0 0 4px #000}
.ov .sub{position:absolute;bottom:22px;width:100%;text-align:center;font-size:18px;text-shadow:0 0 6px #000,0 0 2px #000}
.ov .black{position:absolute;inset:0;background:#000;opacity:0}
.ov .tag{position:absolute;top:8px;right:10px;color:var(--accent);font-size:11px;text-shadow:0 0 4px #000}
#inspector{width:680px;max-width:58%;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 12px}
.card{position:absolute;width:176px;min-height:54px;border:1px solid var(--line);border-left:5px solid;border-radius:6px;background:var(--panel2);padding:5px 8px;cursor:pointer;user-select:none}
.card.sel{outline:2px solid var(--accent)}.card .t{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.card .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .m{font-size:11px;color:var(--dim)}
.card .badge{position:absolute;top:4px;right:6px;font-size:10px;background:var(--warn);color:#000;border-radius:8px;padding:0 5px}
.scene{border-left-color:var(--scene)}.stitch{border-left-color:var(--stitch)}.choice{border-left-color:var(--choice)}.ending{border-left-color:var(--ending)}
svg#edges{position:absolute;left:0;top:0;pointer-events:none}
h2{font-size:12px;margin:12px 0 5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}h2:first-child{margin-top:0}
.row{display:flex;gap:6px;align-items:center;margin:3px 0;flex-wrap:wrap}.row>label:first-child{color:var(--dim);min-width:64px}
.kv{color:var(--dim);font-size:12px}.muted{color:var(--dim)}.err{color:var(--bad)}.ok{color:var(--good)}.warnc{color:var(--warn)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:2px 3px;vertical-align:top;text-align:left}th{color:var(--dim);font-weight:500;font-size:11px}
td input,td select{width:100%;padding:2px 4px}
.clip{border:1px solid var(--line);border-left:4px solid var(--scene);border-radius:6px;padding:6px 8px;margin:7px 0;background:var(--panel2)}
.clip.over{border-left-color:var(--bad)}.clip h3{margin:0;font-size:12px;display:flex;gap:6px;align-items:center}
.clip .sec{border-top:1px dashed var(--line);margin-top:5px;padding-top:4px}
.clip .lab{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.fix{background:#2a2316;border:1px solid #5b4318;border-radius:4px;padding:4px 6px;margin-top:4px;font-size:12px}
.fix button{margin-left:6px;padding:1px 6px}
.tabs{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}.tabs button.on{border-color:var(--accent);color:var(--accent)}
.timeline{position:relative;height:56px;background:#151518;border:1px solid var(--line);border-radius:4px;margin:6px 0 2px}
.seg{position:absolute;top:22px;height:26px;background:#3d2e5c;border:1px solid var(--scene);border-radius:3px;font-size:11px;padding:1px 4px;overflow:hidden;white-space:nowrap}
.seg.est{background:repeating-linear-gradient(45deg,#3d2e5c,#3d2e5c 6px,#33274d 6px,#33274d 12px)}.seg.ev{background:#5b2a2a;border-color:var(--bad)}
.seam{position:absolute;top:18px;width:3px;height:34px;background:var(--accent)}.cue{position:absolute;top:3px;width:2px;height:16px;background:var(--cue)}
.cue span{position:absolute;top:-1px;left:4px;font-size:10px;color:var(--cue);white-space:nowrap}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.7}
.note{border:1px solid var(--line);border-radius:5px;padding:6px 8px;margin:5px 0;background:var(--panel2)}.note.done{opacity:.5}
.note .by{font-size:11px;color:var(--accent)}.note .by.claude{color:#8fb7ff}
pre{white-space:pre-wrap;font-size:12px;background:#151518;padding:8px;border-radius:4px;border:1px solid var(--line)}
.page{padding:12px 16px;overflow:auto;flex-direction:column}
.sb-node{margin:10px 0 16px}.sb-node h3{margin:0 0 6px;font-size:13px}.sb-strip{display:flex;gap:8px;flex-wrap:wrap}
.sb-frame{width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.sb-frame img{width:100%;display:block}.sb-frame div{padding:4px 6px;font-size:11px}.sb-frame .line{font-size:12px;color:var(--text)}
.sb-card{width:250px;min-height:120px;border:1px dashed var(--line);border-radius:5px;padding:8px;font-size:12px;background:#17171b}
#watchView{flex-direction:column}
.takepip{position:absolute;right:10px;top:10px;width:240px;border:1px solid var(--line);border-radius:4px;background:#000;z-index:5;display:none}
#watchBox{flex:1;position:relative;background:#000;overflow:hidden;cursor:crosshair}
#watchBar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
.wcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(0,0,0,.72);pointer-events:auto}
.wcard .big{font-size:24px}.wcard .timer{font-size:30px;color:var(--warn);font-variant-numeric:tabular-nums}
.reply{position:absolute;left:0;right:0;bottom:70px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 8%;pointer-events:none}
.reply .ropt{pointer-events:auto;min-width:220px;max-width:38%;background:rgba(10,10,12,.72);border:1px solid rgba(217,164,65,.55);border-radius:6px;padding:8px 16px;text-align:center}
.reply .ropt:hover{border-color:var(--accent);background:rgba(40,30,12,.85)}.reply .rja{font-size:13px;color:var(--dim)}.reply .ren{font-size:19px}
.reply .rbar{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);width:200px}
.rbar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}.rbar div{height:100%;background:var(--accent);width:100%}
.barksub{position:absolute;left:50%;top:18%;transform:translateX(-50%);color:var(--dim);font-style:italic;font-size:16px;pointer-events:none}
.wcard.death{border-color:var(--bad)}.wcard.death .muted:first-child{color:var(--bad);letter-spacing:.2em}
.bmap{position:relative;margin-top:10px;overflow:auto}
.bcard{position:absolute;width:176px;min-height:54px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.bcard .t{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}.bcard .n{font-size:13px}.bcard .m{font-size:10px;color:var(--good)}
.bcard.locked{background:#141417;border-style:dashed;color:#4a4a52;cursor:default}.bcard.locked .n{font-size:18px;color:#4a4a52}
.bcard.got.scene{border-left:3px solid var(--scene)}.bcard.got.stitch{border-left:3px solid var(--stitch)}.bcard.got.choice{border-left:3px solid var(--choice)}.bcard.got.ending{border-left:3px solid var(--ending)}
.bcard.got.deathc{background:#2a1416}.bcard.hl{box-shadow:0 0 0 2px var(--accent)}
.qte{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);text-align:center;pointer-events:auto}
.qte .key{display:inline-block;border:2px solid var(--accent);border-radius:6px;padding:6px 14px;font-size:20px;color:var(--accent);margin:6px}
.qte .bar{width:320px;height:10px;border:1px solid var(--accent);border-radius:5px;overflow:hidden;margin:6px auto}.qte .bar div{height:100%;background:var(--accent);width:0}
.warnmark{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:44px;color:var(--warn);text-shadow:0 0 12px #000}
#offline{display:none;padding:10px;background:#3a2a10;border-bottom:1px solid var(--warn)}
#banner{display:none;padding:6px 10px;background:#1d3346;border-bottom:1px solid #3d6a8f}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<header>
  <h1>DIRECTOR'S DESK</h1>
  <select id="game"></select>
  <button id="newGame" title="Start a new game: a folder in Content/Games with a minimal story">+ New game</button>
  <button id="gameSettings">Game</button>
  <button id="save" class="primary" title="Ctrl+S">Save</button>
  <button id="reload">Reload</button>
  <button id="check">Run checks</button>
  <a href="poses.html" target="_blank"><button>Poses</button></a>
  <a href="bodies.html" target="_blank"><button title="Check how a body file in Content/Studio/Bodies follows the blocking">Bodies</button></a>
  <a href="flesh.html" target="_blank"><button title="The fat-suit experiment: jiggle and sag worked out from body fat (docs/FLESH.md)">Fat suit</button></a>
  <a href="kimodo.html" target="_blank"><button title="The Kimodo shot list: every motion to make in the demo, with its prompt, length, constraints and save name">Kimodo</button></a>
  <a href="shape.html" target="_blank"><button title="Shape each cast member's body (MHR), save it to the story, export it for MetaHuman">Shape</button></a>
  <a href="builder.html" target="_blank"><button title="The scene builder: a level as a floor plan (rooms, doors, sliding doors, windows; Japanese reference layouts), walked from the player's eye">Scene builder</button></a>
  <span id="status">loading…</span>
</header>
<div id="offline">The desk needs its server: run <code>python tools/director/serve.py</code> and open http://127.0.0.1:8780</div>
<div id="banner">story.json changed on disk (Claude edited it?). <button id="bannerReload">Reload</button> <span class="muted">your unsaved edits here would be lost</span></div>
<nav>
  <button data-v="flowView" class="on">Flow</button>
  <button data-v="boardView">Storyboard</button>
  <button data-v="watchView">Watch</button>
  <button data-v="branchView" title="every branch reached, and the ones missed; play from any reached node">Branches</button>
  <button data-v="clipsView">Takes</button>
  <button data-v="notesView">Notes</button>
</nav>
<main>
  <section id="flowView" class="view on">
    <div id="leftcol">
      <div id="board"><svg id="edges"></svg></div>
      <div id="stagePanel">
        <div id="stageBox"><div class="ov" id="stageOv"><div class="black"></div><div class="who"></div><div class="tag"></div><div class="ja"></div><div class="sub"></div></div></div>
        <div id="stageBar">
          <button id="sPlay">▶ scene</button><button id="sStop">■</button>
          <input type="range" id="scrub" min="0" max="10" step="0.01" value="0"><span id="sTime" class="muted">0.0 s</span>
          <button id="sFree" title="Inspect from outside (drag to orbit, wheel to zoom)">Free cam</button>
          <button id="sFix" title="Which parts the player sees; mismatches; joins">Check bodies</button>
          <button id="sExport" title="The blocking as glTF for Unreal (Content/Games/&lt;Game&gt;/Previs)">Export glTF</button>
        </div>
      </div>
    </div>
    <aside id="inspector"></aside>
  </section>
  <section id="boardView" class="view page"></section>
  <section id="watchView" class="view">
    <div id="watchBox"><div class="ov" id="watchOv"><div class="black"></div><div class="who"></div><div class="tag"></div><div class="ja"></div><div class="sub"></div></div></div>
    <div id="watchBar">
      <button id="wStart" class="primary">▶ Play from the start</button>
      <button id="wStop">■ Stop</button>
      <label title="the takes' video in the corner; off keeps their audio only"><input type="checkbox" id="wVideo" checked> take video</label>
      <label><input type="checkbox" id="wSpeak"> speak the Japanese</label>
      <label><input type="checkbox" id="wSecrets"> finds the secrets</label>
      <label><input type="checkbox" id="wFast" checked> tasks auto-finish after 2 s</label>
      <label title="Cutscenes can't be skipped in the game; this is for the desk only"><input type="checkbox" id="wSkip"> dev: Esc skips</label>
      <span id="wClock" class="muted"></span><span id="wKarma" class="muted" title="the run's karma (a debug meter: the player never sees it)"></span><span id="wTrail" class="muted"></span>
    </div>
  </section>
  <section id="branchView" class="view page"></section>
  <section id="clipsView" class="view page"></section>
  <section id="notesView" class="view page"></section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
