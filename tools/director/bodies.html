<!doctype html>
<html><head><meta charset="utf-8"><title>Body Check</title><link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script></head>
<body style="margin:0;background:#111;color:#ddd;font:12px sans-serif"><div style="padding:10px 14px"><b style="color:#d9a441;letter-spacing:.05em">BODY CHECK</b> · <select id="pick"></select> · blue: the previs figure, beige: the body driven by it · <span id="msg"></span></div><div id="grid" style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px"></div>
<script type="module">
import * as THREE from "three";
import * as M from "./motion.js";
import { Figure } from "./stage.js";
import { BodyFigure, loadBody, mapBones } from "./bodies.js";
const lib = M.loadLibrary(await (await fetch("/api/poses")).json());
const q = new URLSearchParams(location.search);
{
  const files = (await (await fetch("/api/bodies")).json()).bodies;
  const file = q.get("file") || files[0];
  const pick = document.getElementById("pick");
  for (const f of files) pick.append(new Option(f, f, false, f === file));
  pick.onchange = () => location.search = "?file=" + encodeURIComponent(pick.value);
  if (!file) { document.getElementById("msg").textContent = "No body files yet: drop a rigged human (.fbx/.glb) into Content/Studio/Bodies and reload."; throw new Error("no bodies"); }
  const tpl = await loadBody("/bodies/" + encodeURIComponent(file));
  const info = mapBones(tpl);
  const body = new BodyFigure(lib, 1.7, tpl), caps = new Figure(lib, 1.7, 0x6f8fb0);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1e1e22);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6)); const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 4, 3); scene.add(d);
  caps.group.position.set(-0.6, 0, 0); body.group.position.set(0.6, 0, 0); scene.add(caps.group, body.group);
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(360, 260, false);
  const cam = new THREE.PerspectiveCamera(32, 360 / 260, 0.1, 50); cam.position.set(1.6, 1.3, 4.6); cam.lookAt(0, 0.85, 0);
  const errs = {};
  for (const name of lib.names) {
    const pos = M.fk(lib, M.clonePose(lib.poses[name]), 1.7).pos;
    caps.update(pos); body.update(pos); scene.updateMatrixWorld(true);
    // judged by direction (each limb pointing the previs way), not position: a real body's proportions differ
    let sum = 0, n = 0, worst = ["", 0], cm = 0, cn = 0;
    for (const [a0, a1] of [["upperarm_l", "lowerarm_l"], ["lowerarm_l", "hand_l"], ["upperarm_r", "lowerarm_r"], ["lowerarm_r", "hand_r"],
                            ["thigh_l", "calf_l"], ["calf_l", "foot_l"], ["thigh_r", "calf_r"], ["calf_r", "foot_r"], ["spine_03", "head"], ["pelvis", "spine_03"]]) {
      const ma = body.modelJointWorld(a0), mb = body.modelJointWorld(a1), pa = body.jointWorld(a0), pb = body.jointWorld(a1);
      if (!ma || !mb || !pa || !pb) continue;
      const e = mb.clone().sub(ma).angleTo(pb.clone().sub(pa)) * 180 / Math.PI; sum += e; n++; if (e > worst[1]) worst = [a0, e];
      cm += mb.distanceTo(pb); cn++;
    }
    errs[name] = { mean_deg: +(sum / n).toFixed(1), worst: worst[0], worst_deg: +worst[1].toFixed(1), offset_cm: +(cm / cn * 100).toFixed(1) };
    r.render(scene, cam);
    const div = document.createElement("div"); div.innerHTML = `<img src="${r.domElement.toDataURL()}" style="width:100%"><div>${name}: ${errs[name].mean_deg}° (worst ${errs[name].worst} ${errs[name].worst_deg}°) · joints ${errs[name].offset_cm} cm off</div>`;
    document.getElementById("grid").append(div);
  }
  const worst = Math.max(...Object.values(errs).map(e => e.worst_deg));
  document.getElementById("msg").innerHTML = `${Object.keys(info.map).length} bones mapped${info.missing.length ? ", <span style='color:#e05a4f'>missing: " + info.missing.join(", ") + "</span>" : ""} · worst limb direction error ${worst}° ${worst < 12 ? "<span style='color:#5aa65a'>(good)</span>" : "<span style='color:#e0a030'>(check the mapping)</span>"}`;
  window.__result = { mapped: Object.keys(info.map).length, missing: info.missing, errs };
}
</script></body></html>
