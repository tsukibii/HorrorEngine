<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pose Library</title>
<link rel="icon" href="data:,">
<style>
body{margin:0;background:#121214;color:#e6e3dc;font:13px system-ui,Segoe UI,sans-serif}
h1{font-size:14px;color:#d9a441;padding:10px 14px;margin:0;letter-spacing:.05em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0 14px 14px}
.p{background:#1b1b1f;border:1px solid #33333b;border-radius:6px;padding:4px}
.p img{width:100%;display:block;border-radius:4px}.p div{padding:2px 4px;color:#b8b4aa}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<h1>POSE LIBRARY · Content/Studio/poses.json · front and side</h1>
<div id="grid"></div>
<script type="module">
import * as THREE from "three";
import * as M from "./motion.js";
import { Figure } from "./stage.js";
const lib = M.loadLibrary(await (await fetch("/api/poses")).json());
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(460, 300, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1e1e22);
scene.add(new THREE.AmbientLight(0xffffff, 0.6)); const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(2, 4, 3); scene.add(d);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x2a2a30 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const front = new Figure(lib, 1.7), side = new Figure(lib, 1.7);
front.group.position.set(-0.65, 0, 0); side.group.position.set(0.65, 0, 0); side.group.rotation.y = -Math.PI / 2;
scene.add(front.group, side.group);
const cam = new THREE.PerspectiveCamera(32, 460 / 300, 0.1, 50); cam.position.set(0, 1.0, 5.4); cam.lookAt(0, 0.85, 0);
for (const name of lib.names) {
  const pos = M.fk(lib, M.clonePose(lib.poses[name]), 1.7).pos;
  front.update(pos); side.update(pos); r.render(scene, cam);
  const div = document.createElement("div"); div.className = "p";
  div.innerHTML = `<img src="${r.domElement.toDataURL()}"><div>${name}</div>`; document.getElementById("grid").append(div);
}
document.title = "Pose Library (" + lib.names.length + ")";
window.__done = true;
</script>
</body>
</html>
