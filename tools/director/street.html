<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Builder</title>
<link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{--bg:#121214;--panel:#1b1b1f;--panel2:#232329;--line:#33333b;--text:#e6e3dc;--dim:#9a978f;--accent:#d9a441;--good:#5aa65a;--warn:#e0a030;--bad:#e05a4f;--cue:#6fb3d9}
[hidden]{display:none!important}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#5b4318;border-color:var(--accent)}button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
input[type=number]{width:62px}input[type=checkbox]{width:auto}input[type=color]{width:34px;height:22px;padding:0 2px;vertical-align:middle}input[type=range]{vertical-align:middle}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
header h1{font-size:14px;margin:0 8px 0 0;color:var(--accent);letter-spacing:.04em}
header label{color:var(--dim)}
#status{margin-left:auto;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}#status.bad{color:var(--bad)}#status.dirty{color:var(--warn)}
main{display:flex;height:calc(100% - 41px)}
#left{width:236px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:12px 0 5px}h2:first-child{margin-top:0}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:3px}.pal.one{grid-template-columns:1fr}
.pal button{text-align:left;font-size:12px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal button i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pal button.tool{border-color:var(--accent);background:#3a2e14}
.hint{color:var(--dim);font-size:12px}
#centre{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#tabs{display:flex;gap:4px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs .hint{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapBox{flex:1;position:relative;background:#141417;min-height:0}
#map{width:100%;height:100%;display:block;user-select:none}
svg text{font-family:system-ui,Segoe UI,sans-serif;pointer-events:none}
#facadeBox{flex:1;display:flex;flex-direction:column;min-height:0}
#facadeBar{display:flex;flex-wrap:wrap;gap:3px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
#facadeBar button{font-size:12px;padding:2px 6px}#facadeBar button.tool{border-color:var(--accent);background:#3a2e14}
#panels{flex:1;display:flex;min-height:0}
.panel{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.ptitle{display:flex;gap:6px;align-items:center;padding:3px 8px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px}
.ptitle b{color:var(--accent);font-weight:500}.ptitle select{font-size:12px;padding:0 4px}
.pview{flex:1;position:relative;overflow:hidden;background:#0e0e10;min-height:0}
.pview canvas,.pview svg,.pview img.ref{position:absolute;left:0;top:0}
.pview svg{width:100%;height:100%}
.pview img.ref{pointer-events:none;transform-origin:0 0;max-width:none}
.pbar{display:flex;gap:5px;align-items:center;padding:3px 8px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}
#right{width:44%;max-width:820px;min-width:380px;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#viewBar{display:flex;gap:5px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12px}
#viewBar select{font-size:12px}
#view{position:relative;height:58%;min-height:240px;background:#050506;outline:none;overflow:hidden}
#view:focus{box-shadow:inset 0 0 0 1px var(--accent)}
#view canvas{display:block}
#shotRef{position:absolute;pointer-events:none;display:none}
#viewHud{position:absolute;left:8px;top:6px;right:8px;pointer-events:none;color:#ddd;font-size:12px;text-shadow:0 1px 2px #000}
#inspector{flex:1;overflow:auto;padding:6px 10px 30px}
.prop{display:grid;grid-template-columns:96px 1fr;gap:3px 6px;align-items:center;margin-top:3px}
.prop>label{color:var(--dim);font-size:12px}
.prop input[type=text],.prop select,.prop textarea{width:100%}
.prop .row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.prop .row small{color:var(--dim)}
.sec{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.sec>h3{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600;display:flex;gap:6px;align-items:center}
.sec>h3 button{font-size:11px;padding:0 6px;text-transform:none;letter-spacing:0;font-weight:400}
.list{display:flex;flex-direction:column;gap:2px;margin-top:3px}
.list .it{display:flex;gap:6px;align-items:center;padding:2px 5px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px}
.list .it.on{border-color:var(--accent)}.list .it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list .it small{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chips button{font-size:11px;padding:1px 6px}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px;background:var(--panel2)}
.big{font-size:14px;color:var(--accent);margin:0 0 4px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2a2a30;border:1px solid var(--accent);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>STREET BUILDER</h1>
  <label>street</label><select id="street"></select>
  <label title="The light: day, dusk (the blue hour) or night; the windows, signs and lamps light up at dusk">time</label><select id="time"><option value="day">day</option><option value="dusk">dusk</option><option value="night">night</option></select>
  <label title="What a drag snaps to">snap</label><select id="snap"><option value="0.1">10 cm</option><option value="0.25">25 cm</option><option value="0.5">50 cm</option><option value="1">1 m</option></select>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button>
  <button id="pbrShelf" onclick="window.open('pbr.html?from=street', 'pbrshelf')" title="The PBR shelf (assets/pbr): your texture sets; put one on any surface from the inspector's materials">PBR</button>
  <button id="glb" title="Download the street as a .glb: a node a piece, a material a surface (for Godot or Blender)">Export .glb</button>
  <button id="save" class="primary" title="Save the street (Content/Studio/Streets/<name>/street.json); Ctrl+S">Save</button>
  <span id="status">loading…</span>
</header>
<main>
  <section id="left"></section>
  <section id="centre">
    <div id="tabs"><button id="tabMap" class="on" title="The street from above: drag things about, drag handles to resize and turn">Map</button><button id="tabFacade" title="The picked building's front and a side, flat on: add windows, doors, balconies, signs... and put a photo behind each">Facade</button><span class="hint" id="centreHint"></span></div>
    <div id="mapBox"><svg id="map"></svg></div>
    <div id="facadeBox" hidden>
      <div id="facadeBar"></div>
      <div id="panels">
        <div class="panel" data-panel="a"><div class="ptitle"><b>Front</b><select class="pface"></select><span class="hint pnote"></span></div>
          <div class="pview"><img class="ref" alt=""><canvas></canvas><svg></svg></div>
          <div class="pbar"><button class="ppaste" title="Paste a photo of this side (or press Ctrl+V with the pointer over it); drop a file on it works too">Paste photo</button><input type="file" class="pfile" accept="image/*" hidden><button class="pload">Load…</button>
            <label>see <input type="range" class="pop" min="0" max="100" value="55" style="width:70px"></label><label title="The photo in front of the building (to trace it) or behind it"><input type="checkbox" class="ptop"> on top</label>
            <button class="pmove" title="Drag the photo to move it, its corner to size it, so the building's outline lines up">Move photo</button><button class="pfit" title="Size the photo to the building's width">Fit</button><button class="pdrop" title="Take the photo away">✕</button></div></div>
        <div class="panel" data-panel="b"><div class="ptitle"><b>Side</b><select class="pface"></select><span class="hint pnote"></span></div>
          <div class="pview"><img class="ref" alt=""><canvas></canvas><svg></svg></div>
          <div class="pbar"><button class="ppaste">Paste photo</button><input type="file" class="pfile" accept="image/*" hidden><button class="pload">Load…</button>
            <label>see <input type="range" class="pop" min="0" max="100" value="55" style="width:70px"></label><label><input type="checkbox" class="ptop"> on top</label>
            <button class="pmove">Move photo</button><button class="pfit">Fit</button><button class="pdrop">✕</button></div></div>
      </div>
    </div>
  </section>
  <section id="right">
    <div id="viewBar">
      <b style="color:var(--accent)">View</b>
      <select id="mode" title="Orbit round the street, walk it at the player's eye (WASD, drag to look), or look through a saved shot"></select>
      <button id="addShot" title="Keep this view as a shot (a camera to come back to; a photo can be matched to it)">+ Shot</button>
      <span id="shotTools" hidden>
        <button id="shotPhoto" title="Paste (Ctrl+V) or load the photo this shot should match">Photo…</button><input type="file" id="shotFile" accept="image/*" hidden>
        <label>see <input type="range" id="shotOp" min="0" max="100" value="50" style="width:70px"></label>
        <label title="Drag in the view to turn this shot, WASD to move it, Q/E down and up, the wheel for the lens"><input type="checkbox" id="shotAdjust"> adjust</label>
        <span class="hint" id="shotNote"></span>
      </span>
    </div>
    <div id="view" tabindex="0"><img id="shotRef" alt=""><div id="viewHud"></div></div>
    <div id="inspector"></div>
  </section>
</main>
<div id="toast"></div>
<script type="module" src="./street.js"></script>
</body>
</html>
