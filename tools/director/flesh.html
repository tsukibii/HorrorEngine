<style>

<body>
<header>
  <b>FAT SUIT</b>
  <select id="mode"><option value="suit">fat suit</option><option value="balloons">water balloons</option></select>
  <select id="solver" title="soft bones: each region a short spring chain the mesh is skinned to (EZSoftBone, Kawaii Physics); per-point springs: the first experiment"><option value="soft">soft bones</option><option value="points">per-point springs</option></select>
  <select id="body"><option value="heavy">heavy</option><option value="average">average</option><option value="mari">Mari (Pilot)</option><option value="hourglass">chubby hourglass (Mari)</option></select>

    <select id="support"><option value="1">no bra</option><option value="2.5">everyday bra</option><option value="7">sports bra</option></select></span>

  <label><input type="checkbox" id="ghost"> ghost suit</label>
  <label title="the mesh's lines: how the skin stretches"><input type="checkbox" id="wire"> wireframe</label>
  <button id="exp" title="Soft bones: the bones to add, their skin weights and settings (for Kawaii Physics); per-point springs: the thickness map. JSON in Content/Games/Pilot/Characters, for the Unreal side">Export</button>

<script type="module">
// The fat-suit experiment (docs/FLESH.md): the character as a lean body (dark red, inside) wearing its fat (the
// suit). Thickness comes from the gap between them; the physics from thickness (flesh.js).
import * as THREE from "three";
import * as M from "./motion.js";
import { BodyFigure, loadBody, shapeMesh, SHAPES } from "./bodies.js";
import { FleshSim, leanShape, flatShape, balloonSculpt, hourglassShape, HOURGLASS_SCULPT, FLESH_DEFAULTS } from "./flesh.js";
import { SoftBoneSim, SOFT_MATERIALS, supported } from "./softbone.js";
// water balloons: denser than fat (about 1000 kg/m3), damped about 0.2 of critical (Chen et al.'s FE study of breast
// motion), shear tuned so a D cup (about 0.55 L) moves about 15 cm relative to the torso running at 2.8 m/s with no
// bra and about 4 cm walking (Scurr, White and Hedger 2011)
const BALLOON_PHYS = { density: 1000, damping: 0.2, shear: 250, skin: 0.01, coupling: 0.3, holdRamp: 0.006, maxStretch: 2.5, maxSquash: 0.7 };
const $ = s => document.querySelector(s);
const status = t => $("#status").textContent = t;
const lib = M.loadLibrary(await (await fetch("/api/poses")).json());
const tpl = await loadBody("/bodies/MHR.fbx");
// MHR's levels of detail (vertices): 4 2,461 (MHR.fbx, the desk's), 2 10,661 (MHR_hi.fbx), 1 18,437 and 0 73,639
// (MHR_lod1.fbx, MHR_lod0.fbx: optional, from MHR's release). Round shapes need points: auto takes LOD 2 for the
// balloons and the hourglass, LOD 4 for the other fat suits
const LODS = { 4: "MHR.fbx", 2: "MHR_hi.fbx", 1: "MHR_lod1.fbx", 0: "MHR_lod0.fbx" }, tplLod = { 4: tpl };
async function lodTemplate(l) { if (!tplLod[l]) try { tplLod[l] = await loadBody("/bodies/" + LODS[l]); } catch (e) { status(`no ${LODS[l]} in Content/Studio/Bodies`); tplLod[l] = tplLod[2] || tpl; } return tplLod[l]; }
async function hiTemplate() { return lodTemplate(2); }
const SHAPES_BY = {
  heavy: Array.from({ length: SHAPES }, (_, i) => i === 0 ? 2.8 : i === 1 ? 1.5 : 0),
  average: new Array(SHAPES).fill(0),
};
try { const st = (await (await fetch("/api/story/Pilot")).json()).story; SHAPES_BY.mari = (st.cast.mari.shape || []).concat(new Array(SHAPES).fill(0)).slice(0, SHAPES); } catch (e) { SHAPES_BY.mari = SHAPES_BY.average; }

// ---- scenarios: a pose and where the body is, over time ----------------------------------------------------
// the trunk's height while running: a ballistic flight (60 % of each step), then a stance that compresses about 4 cm
// at about 2 g (2.8 steps a second); together about 9 cm up and down, as in runners
function runBounce(t) {
  const T = 1 / 2.8, ph = (t % T) / T, tf = 0.6 * T, g = 9.81, v0 = g * tf / 2;
  if (ph < 0.6) { const u = ph * T; return 0.04 + v0 * u - g * u * u / 2; }
  return 0.04 - 0.04 * Math.sin(Math.PI * (ph - 0.6) / 0.4);
}
const smooth = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const SCEN = {
  bounce: { dur: 3.5, at: t => ({ pose: "idle", y: t < 2 ? 0.06 * Math.abs(Math.sin(Math.PI * 2 * t)) : 0 }), note: "small hops at 2 Hz for 2 s, then still: how it rings and settles" },
  jump: { dur: 3, at: t => {
      if (t < 0.5) return { pose: "crouch", w: smooth(t / 0.4), y: 0 };
      if (t < 1.1) { const u = (t - 0.5) / 0.6; return { pose: "crouch", w: 1 - smooth(u * 3), y: 0.35 * 4 * u * (1 - u) }; }
      if (t < 1.4) return { pose: "crouch", w: Math.sin(Math.PI * (t - 1.1) / 0.3) * 0.6, y: 0 };
      return { pose: "idle", y: 0 }; }, note: "crouch, jump 35 cm, land: the landing is the big jolt" },
  walkstop: { dur: 3.5, at: t => {
      const walking = t < 2, ph = (t * 1.8) % 1;
      return { pose: walking ? (ph < 0.5 ? "walk_a" : "walk_b") : "idle", mix: walking ? ["walk_a", "walk_b", 0.5 - 0.5 * Math.cos(ph * 2 * Math.PI)] : null,
               z: Math.min(t, 2) * 1.3, y: walking ? 0.025 * Math.abs(Math.sin(ph * 2 * Math.PI)) : 0 }; }, note: "walks at 1.3 m/s, stops dead at 2 s" },
  turn: { dur: 2.5, at: t => ({ pose: "idle", yaw: 2.2 * smooth((t - 0.5) / 0.3) }), note: "a sharp 125° turn in 0.3 s" },
  lie: { dur: 4, at: t => ({ pose: "idle", tilt: -Math.PI / 2 * smooth((t - 0.5) / 1.2), y: 0.13 * smooth((t - 0.5) / 1.2) }), note: "lies on the back on the floor: gravity now pulls the fat sideways (the sag), the backside presses flat" },
  run: { dur: 4.5, at: t => {
      const running = t < 3, ph = (t * 1.4) % 1;                        // 2.8 steps a second, 2.8 m/s
      return { pose: "idle", mix: running ? ["walk_a", "walk_b", 0.5 - 0.5 * Math.cos(ph * 2 * Math.PI)] : null, z: Math.min(t, 3) * 2.8,
               // the trunk also sways side to side (about 2.5 cm) and twists with the arms (about 10 degrees) each stride
               y: running ? runBounce(t) : 0, x: running ? 0.025 * Math.sin(ph * 2 * Math.PI) : 0, yaw: running ? 0.17 * Math.sin(ph * 2 * Math.PI) : 0 }; }, note: "runs at 2.8 m/s for 3 s (the breast-motion studies' speed), then stops" },
  walk: { dur: 3, at: t => { const ph = (t * 0.9) % 1; return { pose: "idle", mix: ["walk_a", "walk_b", 0.5 - 0.5 * Math.cos(ph * 2 * Math.PI)], z: t * 1.3,
      y: 0.045 * (0.5 - 0.5 * Math.cos(Math.PI * 2 * 1.8 * t)), x: 0.02 * Math.sin(ph * 2 * Math.PI), yaw: 0.08 * Math.sin(ph * 2 * Math.PI) }; }, note: "walks at 1.3 m/s (4.5 cm of trunk rise each step, sway and twist)" },
};
// with things to touch: ctx has the body's front (how far its soft front stands ahead of its feet), the soft regions'
// tips at rest (ctx.tip("breast L")) and the floor; setup returns the colliders (and draws them)
function walkInto(t, stop, hold = 2.4, back = 0.35) {      // walk to a stop, hold, step back
  const v = 1.1, reach = stop / v;
  if (t < reach) { const ph = (t * 0.9) % 1; return { mix: ["walk_a", "walk_b", 0.5 - 0.5 * Math.cos(ph * 2 * Math.PI)], z: t * v, y: 0.03 * (0.5 - 0.5 * Math.cos(Math.PI * 2 * 1.8 * t)) }; }
  if (t < hold) return { pose: "idle", z: stop };
  return { pose: "idle", z: stop - back * smooth((t - hold) / 0.5) };
}
Object.assign(SCEN, {
  wall: { dur: 4, setup: ctx => { const Z = 1.4; ctx.stop = Z - ctx.front + 0.035; return [{ type: "plane", p: new THREE.Vector3(0, 0, Z), n: new THREE.Vector3(0, 0, -1), show: { w: 3, h: 2.4 } }]; },
          at: (t, ctx) => walkInto(t, ctx.stop), note: "walks into a wall and leans 3.5 cm on it, then steps back: what's in front flattens" },
  ball: { dur: 3, setup: ctx => { const tip = ctx.tip(ctx.balloons ? "breast L" : "belly"); ctx.ball = { r: 0.11, x: tip.x, y: tip.y, z: tip.z + 0.11 - 0.06 }; return [{ type: "sphere", c: new THREE.Vector3(), r: 0.11, show: true, move: t => { const d = 2.5 * Math.abs(t - 1); return new THREE.Vector3(ctx.ball.x, ctx.ball.y + 0.1 * (t - 1), ctx.ball.z + d); } }]; },
          at: () => ({ pose: "idle" }), note: "a ball (22 cm, tossed at 2.5 m/s) hits the chest or belly, sinks in 6 cm and bounces off" },
  prone: { dur: 4, setup: ctx => [], at: (t, ctx) => ({ pose: "idle", tilt: Math.PI / 2 * smooth((t - 0.5) / 1.2), y: (ctx.front - 0.03) * smooth((t - 0.5) / 1.2) }), note: "lies face down on the floor: the front presses flat and spreads" },
  arms: { dur: 4, setup: ctx => [], at: t => ({ pose: "arms_crossed", w: smooth((t - 0.4) / 0.6) * (1 - smooth((t - 2.6) / 0.5)) }), note: "crosses the arms and lets go: the arms push the chest" },
  counter: { dur: 4, setup: ctx => { const tip = ctx.tip(ctx.balloons ? "breast L" : "belly"), top = tip.y + 0.05, Z = 1.4; ctx.stop = Z - ctx.front + 0.04;
             const m = new THREE.Matrix4().makeTranslation(0, top / 2, Z + 0.3); return [{ type: "box", m, half: new THREE.Vector3(1, top / 2, 0.3), show: true }]; },
          at: (t, ctx) => walkInto(t, ctx.stop), note: "walks into a counter as high as the chest or belly and leans on it" },
});
for (const [k, v] of Object.entries(SCEN)) $("#scen").append(new Option(`${k}: ${v.note}`, k));

// ---- the scene ------------------------------------------------------------------------------------------------
const view = $("#view"), R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); view.append(R.domElement);
R.localClippingEnabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x17181b);
scene.add(new THREE.HemisphereLight(0xc8ccd6, 0x2a2420, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 3); scene.add(key);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: 0x24252a, roughness: 1 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(30, 1, 0.05, 50);
const orbit = { yaw: 0.9, pitch: 0.1, dist: 4.4, ty: 1.0, follow: true };
const cut = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
let wireMesh = null;
let fig = null, sim = null, outerMesh = null, innerMesh = null, report = null, colours = null;
function size() { const w = view.clientWidth, h = view.clientHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); draw(); }
function draw() {
  const c = fig ? fig.group.position : new THREE.Vector3();
  const tx = (orbit.follow ? c.x : 0) + (orbit.ox || 0), tz = (orbit.follow ? c.z : 0) + (orbit.oz || 0);   // ox, oz: look off the feet (lying down)
  cam.position.set(tx + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, orbit.ty + Math.sin(orbit.pitch) * orbit.dist, tz + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);
  cam.lookAt(tx, orbit.ty, tz);
  cut.constant = c.x;
  R.render(scene, cam);
}
new ResizeObserver(size).observe(view);

const REGIONS = { belly: ["c_spine0", "c_spine1"], chest: ["c_spine2", "c_spine3"], butt: ["root"], thighs: ["upleg_twist"], "upper arms": ["uparm_twist"], face: ["c_head", "c_jaw"] };
function regionOf(sim) {                          // each point's region, from its strongest skin weight
  const G = sim.mesh.geometry, SI = G.attributes.skinIndex, SW = G.attributes.skinWeight, bones = sim.mesh.skeleton.bones;
  return sim.rep.map((r, v) => {
    let best = -1, bw = 0; for (let k = 0; k < 4; k++) if (SW.getComponent(r, k) > bw) { bw = SW.getComponent(r, k); best = SI.getComponent(r, k); }
    const name = bones[best] ? bones[best].name : "";
    if (name === "root") return sim.outerBind[v * 3 + 2] < 0 ? "butt" : "belly";
    for (const [reg, keys] of Object.entries(REGIONS)) if (keys.some(k => name.includes(k))) return reg;
    return null;
  });
}

async function build(which) {
  status("building...");
  if (fig) { scene.remove(fig.group); scene.remove(outerMesh); scene.remove(innerMesh); }
  const balloons = $("#mode").value === "balloons";
  $("#bopts").style.display = balloons ? "" : "none";
  let outer = SHAPES_BY[which], lean, rep;
  const hourglass = !balloons && which === "hourglass";
  const lod = $("#lod").value, T = lod !== "auto" ? await lodTemplate(+lod) : balloons || hourglass ? await hiTemplate() : tpl;   // round curves need points
  if (lod !== "auto") SHAPES_BY.hourglass = null;    // the fit is per mesh
  // the chubby hourglass: MHR's body sliders fitted to fuller bust, hips, backside and thighs at Mari's waist, then
  // sculpted (bust and backside volumes, a cinched waist: HOURGLASS_SCULPT); a fat suit over its own lean body
  if (hourglass) outer = SHAPES_BY.hourglass = SHAPES_BY.hourglass || hourglassShape(shapeMesh(T), SHAPES_BY.mari).lean;
  if (balloons) { const f = flatShape(shapeMesh(T), SHAPES_BY.mari); outer = lean = f.lean; rep = f.report; }
  else ({ lean, report: rep } = leanShape(shapeMesh(T), outer));
  fig = new BodyFigure(lib, 1.7, T, { shape: outer });
  fig.noUnclip = true;
  shapeMesh(fig.model).visible = false;
  scene.add(fig.group);
  fig.update(M.fk(lib, M.clonePose(lib.poses.idle), 1.7).pos);
  fig.group.updateMatrixWorld(true);
  const soft = $("#solver").value === "soft", Sim = soft ? SoftBoneSim : FleshSim, sup = +$("#support").value;
  const sc0 = sculptFor(balloons, hourglass), sculpt = sc0 ? { sculpt: sc0 } : {};
  sim = new Sim(fig, outer, lean, Object.assign(sculpt, balloons ? BALLOON_PHYS : {}));
  sim.jiggle = +$("#jiggle").value;
  if (soft && balloons && sup > 1) { sim.support = sup; sim.setupChains(); }
  if (soft) Object.assign(sim.amount, AMOUNT);
  if (!soft && balloons) { const sup = +$("#support").value; for (let i = 0; i < sim.N; i++) if (sim.region[i] === 1 || sim.region[i] === 2) sim.k[i] *= sup; sim.bulk[1].k = sim.bulk[2].k = sup; }
  sim.step(1 / 60);
  // render meshes on the welded points
  const mk = (mat) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(sim.N * 3), 3)); g.setIndex(sim.index); const m = new THREE.Mesh(g, mat); m.frustumCulled = false; scene.add(m); return m; };
  colours = new Float32Array(sim.N * 3); sync.wts = false;
  const maxH = Math.max(...sim.h);
  for (let i = 0; i < sim.N; i++) { const t = Math.min(1, sim.h[i] / Math.max(0.03, maxH)); const c = new THREE.Color().setHSL(0.6 - 0.6 * t, 0.65, 0.35 + 0.25 * t); colours.set([c.r, c.g, c.b], i * 3); }
  outerMesh = mk(new THREE.MeshStandardMaterial({ color: 0xcdbfae, roughness: 0.75, side: THREE.DoubleSide, transparent: true, opacity: 1, clippingPlanes: [] }));
  outerMesh.geometry.setAttribute("color", new THREE.BufferAttribute(colours, 3));
  innerMesh = mk(new THREE.MeshStandardMaterial({ color: 0x8a2f2f, roughness: 0.6, side: THREE.DoubleSide }));
  if (wireMesh) scene.remove(wireMesh);
  { const g = new THREE.BufferGeometry(); g.setAttribute("position", outerMesh.geometry.attributes.position); g.setIndex(sim.index);
    wireMesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x1a1410, wireframe: true, transparent: true, opacity: 0.35, depthWrite: false })); wireMesh.frustumCulled = false; wireMesh.renderOrder = 3; scene.add(wireMesh); }
  report = { lean: rep, regions: sim.region ? Array.from(sim.region, r => sim.regionNames[r] || null) : regionOf(sim), balloons, soft, body: which };
  if (soft) { loadPaint(); sim.mesh.updateMatrixWorld(true); sim.skin(sim.R, sim.outerBind, null); sim.x.set(sim.R); }
  sync(); summary(); if (soft) makeOverlay(); else if (overlay) overlay.visible = false;
  status(`${which}: ${sim.N} points`);
}
function sync() {
  outerMesh.geometry.attributes.position.array.set(sim.x); outerMesh.geometry.attributes.position.needsUpdate = true; outerMesh.geometry.computeVertexNormals();
  innerMesh.geometry.attributes.position.array.set(sim.leanX || sim.A); innerMesh.geometry.attributes.position.needsUpdate = true; innerMesh.geometry.computeVertexNormals();
  const wts = $("#wts").checked && !!sim.chains, heat = $("#heat").checked || wts;
  if (wts !== sync.wts) {                          // swap the colours: thickness or the soft bones' spread
    const col = outerMesh.geometry.attributes.color;
    if (wts) for (let i = 0; i < sim.N; i++) { let w = 0; for (const c of sim.chains) w += c.w[i]; const cc = new THREE.Color().setHSL(0.66 - 0.66 * Math.min(1, w), 0.7, 0.32 + 0.2 * Math.min(1, w)); col.array.set([cc.r, cc.g, cc.b], i * 3); }
    else col.array.set(colours);
    col.needsUpdate = true; sync.wts = wts;
  }
  outerMesh.material.vertexColors = heat; outerMesh.material.color.set(heat ? 0xffffff : 0xcdbfae); outerMesh.material.needsUpdate = true;
  outerMesh.material.opacity = $("#ghost").checked ? 0.35 : 1; outerMesh.material.depthWrite = !$("#ghost").checked;
  outerMesh.material.clippingPlanes = $("#cut").checked ? [cut] : [];
  innerMesh.visible = $("#cut").checked || $("#ghost").checked;
  if (wireMesh) wireMesh.visible = $("#wire").checked;   // the lean body is a diagnostic: shown cut open or through the ghost
}
function perRegion(fn) {
  const acc = {}; report.regions.forEach((r, i) => { if (!r) return; (acc[r] = acc[r] || []).push(fn(i)); });
  return Object.fromEntries(Object.entries(acc).map(([r, a]) => [r, a.reduce((s, x) => s + x, 0) / a.length]));
}
function summary(last) {
  const th = perRegion(i => sim.h[i] * 100), fq = perRegion(i => sim.h[i] > 0.004 ? sim.freq(i) : NaN), sg = perRegion(i => sim.sag90(i) * 100);
  const rows = Object.keys(th).map(r => `<tr><td>${r}</td><td>${th[r].toFixed(1)}</td><td>${isNaN(fq[r]) ? "–" : fq[r].toFixed(1)}</td><td>${sg[r].toFixed(1)}</td>${last ? `<td>${(last.peak[r] || 0).toFixed(1)}</td><td>${(last.end[r] || 0).toFixed(1)}</td>` : ""}</tr>`).join("");
