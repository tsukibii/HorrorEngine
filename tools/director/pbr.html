<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBR Shelf</title>
<link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
:root{--bg:#121214;--panel:#1b1b1f;--panel2:#232329;--line:#33333b;--text:#e6e3dc;--dim:#9a978f;--accent:#d9a441;--good:#5aa65a;--warn:#e0a030;--bad:#e05a4f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#5b4318;border-color:var(--accent)}button.on{border-color:var(--accent);color:var(--accent)}
input[type=checkbox]{width:auto}
header{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
header h1{font-size:14px;margin:0 8px 0 0;color:var(--accent);letter-spacing:.04em}
#status{margin-left:auto;color:var(--dim);overflow:hidden;text-overflow:ellipsis}#status.bad{color:var(--bad)}
main{display:flex;height:calc(100% - 41px)}
#left{width:330px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px}
#left input{width:100%;margin-bottom:6px}
#cats button{font-size:12px;margin:0 3px 3px 0;padding:1px 7px}#cats button small{color:var(--dim)}
.group h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid figure{margin:0;cursor:pointer;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#2a2a2f}
.grid figure:hover{border-color:var(--dim)}.grid figure.on{border-color:var(--accent)}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.grid figcaption{font-size:11px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#centre{flex:1;position:relative;min-width:0}
#view{position:absolute;inset:0}#view canvas{display:block}
#hud{position:absolute;left:10px;top:8px;color:#ddd;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none}
#viewBar{position:absolute;left:10px;bottom:8px;display:flex;gap:6px;align-items:center;background:#1b1b1fcc;padding:4px 8px;border-radius:5px;flex-wrap:wrap}
#viewBar label{color:var(--dim)}
#right{width:360px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 10px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:12px 0 5px}h2:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;align-items:center}.kv span{color:var(--dim)}.kv input{width:100%}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.maps figure{margin:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}.maps img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.maps figcaption{font-size:11px;padding:1px 4px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maps figure.off{opacity:.35}
code{background:var(--panel2);padding:1px 4px;border-radius:3px;font-size:12px;word-break:break-all}
.hint{color:var(--dim);font-size:12px;margin:6px 0}.warn{color:var(--warn)}
.empty{color:var(--dim);padding:20px 8px}
#folders{border:1px solid var(--line);border-radius:5px;padding:6px;margin-bottom:8px;background:#1f1f24}
#folders .f{display:flex;gap:6px;align-items:center;font-size:12px;margin:3px 0}#folders .f b{white-space:nowrap}
#folders .f code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#folders .f button{padding:0 6px}
#browse{margin-top:6px}#browse .dirs{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:4px;margin:4px 0}
#browse .dirs div{padding:2px 6px;cursor:pointer;font-size:12px}#browse .dirs div:hover{background:var(--panel2)}
#browse .row{display:flex;gap:4px;align-items:center;margin:4px 0}#browse .row input{flex:1;min-width:0;margin:0}
</style>
</head>
<body>
<header>
  <h1>PBR SHELF</h1>
  <button id="rescan" title="Look at the shelf again: new folders, ZIPs dropped in (unpacked), changed maps">Rescan</button>
  <a href="builder.html" style="color:var(--dim)">scene builder</a>
  <span id="status"></span>
</header>
<main>
  <div id="left">
    <div id="folders"></div>
    <input id="q" placeholder="search sets">
    <div id="cats"></div>
    <div id="list"></div>
  </div>
  <div id="centre">
    <div id="view"></div>
    <div id="hud"></div>
    <div id="viewBar">
      <button data-shape="sphere" class="on">sphere</button><button data-shape="cube">cube</button><button data-shape="room">room</button><button data-shape="plane">close-up</button>
      <label title="Turn the light round the thing"><input type="checkbox" id="orbit" checked> light turns</label>
      <label title="The displacement map pushes the surface (sphere and close-up; Unreal uses it for Nanite displacement later)">disp <input type="range" id="disp" min="0" max="0.06" step="0.002" value="0.015" style="width:70px;vertical-align:middle"></label>
    </div>
  </div>
  <div id="right"></div>
</main>
<script type="module" src="pbr.js"></script>
</body>
</html>
